    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --gold: #C9A227; --dark: #1a1a1a; --card: #1e1e1e; --text: #e0e0e0; --muted: #888; }
        body { font-family: 'Courier New', monospace; background: var(--dark); color: var(--text); padding: 1rem; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; border-bottom: 3px solid var(--gold); padding-bottom: 1rem; }
        h1 { color: var(--gold); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .subtext { color: var(--muted); font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .agent-box { background: var(--card); border: 2px solid rgba(201, 162, 39, 0.3); border-radius: 8px; padding: 1.5rem; }
        .agent-box:hover { border-color: var(--gold); }
        .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .agent-name { color: var(--gold); font-weight: 700; font-size: 1.1rem; }
        .status { display: inline-block; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }
        .status.online { background: #4CAF50; }
        .status.offline { background: #f44336; }
        .agent-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem; }
        .stat { background: rgba(201, 162, 39, 0.1); padding: 0.5rem; border-left: 2px solid var(--gold); }
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button { padding: 0.4rem 0.8rem; background: var(--gold); color: #111; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 700; }
        button:hover { background: #e0c050; }
        .log { background: rgba(0,0,0,0.3); border: 1px solid rgba(201, 162, 39, 0.2); padding: 1rem; border-radius: 8px; max-height: 300px; overflow-y: auto; margin-top: 2rem; }
        .log-entry { font-size: 0.8rem; padding: 0.3rem 0; color: var(--text); }
        .log-entry.success { color: #4CAF50; }
        .log-entry.error { color: #f44336; }
        .log-entry.warning { color: var(--gold); }
        .log-time { color: var(--muted); }
    </style>

<body>
    <div class="container">
        <header>
            <h1>🤖 SECRET AGENT CONTROL CENTER</h1>
            <p class="subtext">12 Autonomous AI Agents — 24/7 Operations • NO DOWNTIME</p>
            <p style="color: var(--gold); margin-top: 0.5rem; font-size: 0.9rem;">⚠️ CLASSIFIED: Agents operating at 100% capacity</p>
        </header>

        <div class="grid" id="agentGrid"></div>

        <div class="log">
            <div style="color: var(--gold); font-weight: 700; margin-bottom: 0.5rem;">📋 OPERATION LOG</div>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        const AGENTS = [
            { id: 1, emoji: '📝', name: 'Content Master', schedule: '24/7', output: '20+ courses/month', accuracy: '99.2%' },
            { id: 2, emoji: '📊', name: 'Analytics Prophet', schedule: '24/7', output: '10,000 data points/day', accuracy: '99.5%' },
            { id: 3, emoji: '📢', name: 'Marketing Maestro', schedule: '24/7', output: '150+ posts/day', accuracy: '96.8%' },
            { id: 4, emoji: '💬', name: 'Support Sentinel', schedule: '24/7', output: '1,000 conversations/day', accuracy: '94.3%' },
            { id: 5, emoji: '💰', name: 'Pricing Optimizer', schedule: '24/7', output: 'Adjusts 200x/day', accuracy: '97.1%' },
            { id: 6, emoji: '🚀', name: 'Growth Hacker', schedule: '24/7', output: '80+ experiments/day', accuracy: '92.7%' },
            { id: 7, emoji: '✅', name: 'Quality Assurance', schedule: '24/7', output: '300 checks/day', accuracy: '98.9%' },
            { id: 8, emoji: '🔗', name: 'Referral Engine', schedule: '24/7', output: '500 transactions/day', accuracy: '99.8%' },
            { id: 9, emoji: '🔍', name: 'Trend Scout', schedule: '24/7', output: '1,000 scans/day', accuracy: '98.2%' },
            { id: 10, emoji: '👥', name: 'Retention Warrior', schedule: '24/7', output: '400 interventions/day', accuracy: '91.5%' },
            { id: 11, emoji: '✉️', name: 'Email Catalyst', schedule: '24/7', output: '5,000 emails/day', accuracy: '96.3%' },
            { id: 12, emoji: '💵', name: 'Revenue Maximizer', schedule: '24/7', output: 'Optimizes pricing', accuracy: '95.4%' }
        ];

        let logs = [];

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            logs.unshift({ time, message, type });
            if (logs.length > 50) logs.pop();
            updateLogDisplay();
        }

        function updateLogDisplay() {
            const container = document.getElementById('logContainer');
            container.innerHTML = logs.map(log => 
                `<div class="log-entry ${log.type}"><span class="log-time">[${log.time}]</span> ${log.message}</div>`
            ).join('');
        }

        function commandAgent(agentName, cmd) {
            addLog(`${agentName}: ${cmd.toUpperCase()}`);
            if (cmd === 'start') addLog(`✓ ${agentName} ACTIVE`, 'success');
            if (cmd === 'pause') addLog(`⏸️ ${agentName} paused (resuming in 5s)`, 'warning');
            if (cmd === 'resume') addLog(`▶️ ${agentName} RESUMED`, 'success');
            if (cmd === 'stop') addLog(`⛔ ${agentName} stopped (restarting...)`, 'error');
        }

        function renderAgents() {
            const grid = document.getElementById('agentGrid');
            grid.innerHTML = AGENTS.map(agent => `
                <div class="agent-box">
                    <div class="agent-header">
                        <div class="agent-name">${agent.emoji} ${agent.name}</div>
                        <div class="status online">🟢 ONLINE</div>
                    </div>
                    <div class="agent-meta">ID: AGENT-${String(agent.id).padStart(3, '0')}</div>
                    <div class="stats">
                        <div class="stat">Schedule: ${agent.schedule}</div>
                        <div class="stat">Output: ${agent.output}</div>
                        <div class="stat">Accuracy: ${agent.accuracy}</div>
                    </div>
                    <div class="controls">
                        <button onclick="commandAgent('${agent.name}', 'start')">▶️ START</button>
                        <button onclick="commandAgent('${agent.name}', 'pause')">⏸️ PAUSE</button>
                        <button onclick="commandAgent('${agent.name}', 'resume')">▶️ RESUME</button>
                        <button onclick="commandAgent('${agent.name}', 'stop')">⛔ STOP</button>
                    </div>
                </div>
            `).join('');
            addLog('✓ All 12 agents status: OPERATIONAL', 'success');
        }

        // Initialize
        renderAgents();
    </script>
