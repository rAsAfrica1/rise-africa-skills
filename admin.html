<style>
.gate{max-width:420px;margin:4rem auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:2rem;text-align:center}
.gate h1{margin-top:0;color:var(--gold)}
.gate input{width:100%;padding:.7rem;font-size:1rem;background:var(--darker);color:var(--text);border:1px solid var(--border);border-radius:6px;margin:.75rem 0}
.gate button{width:100%;padding:.65rem;background:var(--gold);color:#111;border:none;border-radius:6px;font-weight:700;cursor:pointer}
.gate .err{color:#e74c3c;font-size:.9rem;min-height:1.2em;margin-top:.5rem}
.admin-wrap{max-width:1100px;margin:0 auto;padding:1rem}
.admin-header{background:var(--card);border:1px solid var(--border);padding:1rem;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.admin-header h1{margin:0;font-size:1.2rem;color:var(--gold)}
.admin-header button{background:var(--gold);color:#111;border:none;padding:.5rem .9rem;border-radius:6px;cursor:pointer;font-weight:600}
.stats{background:rgba(201,162,39,.1);border-left:4px solid var(--gold);padding:.75rem 1rem;border-radius:4px;margin-bottom:1rem;font-size:.9rem}
.controls{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.controls input{flex:1;min-width:200px;padding:.6rem;background:var(--darker);color:var(--text);border:1px solid var(--border);border-radius:6px}
.controls button{padding:.6rem 1rem;background:var(--gold);color:#111;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.course-block{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:.75rem;overflow:hidden}
.course-block summary{padding:.8rem 1rem;cursor:pointer;font-weight:600;color:var(--text);list-style:none;display:flex;justify-content:space-between;align-items:center}
.course-block summary::-webkit-details-marker{display:none}
.course-block.enhanced summary{background:rgba(201,162,39,.15)}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.35rem;padding:.75rem}
.module-grid a{display:block;padding:.4rem .6rem;background:var(--darker);border:1px solid var(--border);border-radius:5px;text-decoration:none;color:var(--text);font-size:.85rem}
.module-grid a:hover{border-color:var(--gold);color:var(--gold)}
.hidden{display:none!important}
</style>
</head>

const gate=document.getElementById('gate');
const admin=document.getElementById('admin');
const pwInput=document.getElementById('pw');
const err=document.getElementById('err');
function unlock(){
  if(pwInput.value===ADMIN_PASSWORD){
    localStorage.setItem('ras_admin','1');
    gate.classList.add('hidden');
    admin.classList.remove('hidden');
    render();
  }else{
    err.textContent='Incorrect password.';
    pwInput.value='';
  }
}
function logout(){localStorage.removeItem('ras_admin');location.reload();}
document.getElementById('unlockBtn').addEventListener('click',unlock);
pwInput.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
if(localStorage.getItem('ras_admin')==='1'){
  gate.classList.add('hidden');
  admin.classList.remove('hidden');
  render();
}
function render(filterText){
  filterText=filterText||'';
  const list=document.getElementById('courseList');
  const f=filterText.trim().toLowerCase();
  const filtered=f?COURSES.filter(function(c){return c.name.toLowerCase().indexOf(f)>-1;}):COURSES;
  let total=0;
  COURSES.forEach(function(c){total+=c.modules;});
  document.getElementById('stats').textContent='Showing '+filtered.length+' of '+COURSES.length+' courses - '+total+' modules total';
  list.innerHTML='';
  filtered.forEach(function(c){
    const d=document.createElement('details');
    d.className='course-block'+(c.modules===50?' enhanced':'');
    let links='';
    for(var i=1;i<=c.modules;i++){
      links+='<a href="'+c.slug+'-module-'+i+'.html" target="_blank">Module '+i+'</a>';
    }
    d.innerHTML='<summary><span>'+c.name+'</span><span style="font-size:.85rem;color:var(--muted);font-weight:400">'+c.modules+' modules</span></summary><div class="module-grid">'+links+'</div>';
    list.appendChild(d);
  });
}
document.getElementById('filter').addEventListener('input',function(e){render(e.target.value);});
function clearFilter(){document.getElementById('filter').value='';render();}
</script>
