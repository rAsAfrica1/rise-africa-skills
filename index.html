<script>
// ==================== INDEXEDDB DATABASE LAYER ====================
const DB_NAME = 'RiseAfricaDB';
const DB_VERSION = 1;

class Database {
  constructor() {
    this.db = null;
    this.apiBase = localStorage.getItem('apiBase') || '';
    this.supabaseKey = localStorage.getItem('supabaseKey') || '';
    this.syncQueue = [];
    this.initSync();
  }

  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => { this.db = request.result; resolve(this.db); };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('users')) {
          const users = db.createObjectStore('users', { keyPath: 'email' });
          users.createIndex('role', 'role', { unique: false });
          users.createIndex('status', 'status', { unique: false });
        }
        if (!db.objectStoreNames.contains('courses')) {
          const courses = db.createObjectStore('courses', { keyPath: 'id', autoIncrement: true });
          courses.createIndex('category', 'category', { unique: false });
        }
        if (!db.objectStoreNames.contains('purchases')) {
          const purchases = db.createObjectStore('purchases', { keyPath: 'id', autoIncrement: true });
          purchases.createIndex('userEmail', 'userEmail', { unique: false });
          purchases.createIndex('courseId', 'courseId', { unique: false });
        }
        if (!db.objectStoreNames.contains('certificates')) {
          db.createObjectStore('certificates', { keyPath: 'uniqueId' });
        }
        if (!db.objectStoreNames.contains('activity_log')) {
          const logs = db.createObjectStore('activity_log', { keyPath: 'id', autoIncrement: true });
          logs.createIndex('time', 'time', { unique: false });
        }
        if (!db.objectStoreNames.contains('prices')) db.createObjectStore('prices', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('syncQueue')) db.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
      };
    });
  }

  async transaction(storeName, mode = 'readonly') {
    const db = await this.open();
    return db.transaction(storeName, mode).objectStore(storeName);
  }

  async getAll(storeName, indexName = null, query = null) {
    const store = await this.transaction(storeName);
    const source = indexName ? store.index(indexName) : store;
    return new Promise((resolve, reject) => {
      const request = query ? source.getAll(query) : source.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async get(storeName, key) {
    const store = await this.transaction(storeName);
    return new Promise((resolve, reject) => {
      const request = store.get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async put(storeName, data) {
    const store = await this.transaction(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const request = store.put(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async delete(storeName, key) {
    const store = await this.transaction(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const request = store.delete(key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async clear(storeName) {
    const store = await this.transaction(storeName, 'readwrite');
    return new Promise((resolve, reject) => {
      const request = store.clear();
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async query(storeName, indexName, range) {
    const store = await this.transaction(storeName);
    const index = store.index(indexName);
    return new Promise((resolve, reject) => {
      const request = index.getAll(range);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  // ==================== API SYNC LAYER ====================
  initSync() {
    window.addEventListener('online', () => this.processSyncQueue());
    if (navigator.onLine) this.processSyncQueue();
  }

  async apiRequest(method, endpoint, data = null) {
    if (!this.apiBase || !navigator.onLine) {
      if (data) await this.queueForSync(method, endpoint, data);
      return null;
    }
    try {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) options.body = JSON.stringify(data);
      const res = await fetch(this.apiBase + endpoint, options);
      if (!res.ok) throw new Error(res.statusText);
      return await res.json();
    } catch (e) {
      if (data) await this.queueForSync(method, endpoint, data);
      return null;
    }
  }

  async queueForSync(method, endpoint, data) {
    await this.put('syncQueue', { method, endpoint, data, timestamp: Date.now() });
  }

  async processSyncQueue() {
    if (!this.apiBase || !navigator.onLine) return;
    const items = await this.getAll('syncQueue');
    for (const item of items) {
      try {
        await this.apiRequest(item.method, item.endpoint, item.data);
        await this.delete('syncQueue', item.id);
      } catch (e) { break; }
    }
  }

  async getSettings() {
    const all = await this.getAll('settings');
    const map = {};
    all.forEach(s => map[s.key] = s.value);
    return {
      siteName: map.siteName || 'Rise Africa Skills',
      supportEmail: map.supportEmail || 'support@rise.africa',
      maintenance: map.maintenance || false,
      ...map
    };
  }

  async setSetting(key, value) {
    await this.put('settings', { key, value });
    await this.apiRequest('POST', '/api/settings', { key, value });
  }

  async logActivity(user, action, details) {
    const entry = { time: Date.now(), user, action, details };
    await this.put('activity_log', entry);
    await this.apiRequest('POST', '/api/activity', entry);
  }
}

const db = new Database();

    }
    if (resetToken) {
      this.navigate('reset-password', { token: resetToken });
      return true;

    const bar = document.getElementById('offlineBar');

  // ==================== AUTH ====================
  async login(email, password) {
    const user = await db.get('users', email);
    if (!user || user.password !== password) {
      this.toast('Invalid email or password', 'error');
      return false;
    }
    if (user.status === 'banned') {
      this.toast('Your account has been banned. Contact support.', 'error');
      return false;
    }
    this.currentUser = user;
    sessionStorage.setItem('currentUser', JSON.stringify(user));
    await db.logActivity(user.email, 'Login', 'User logged in');
    this.trackEvent('login', { method: 'email' });
    this.updateNav();
    this.toast(`Welcome back, ${user.name}!`, 'success');
    this.navigate('dashboard');
    return true;
  },

  async register(name, email, password) {
    const existing = await db.get('users', email);
    if (existing) {
      this.toast('Email already registered', 'error');
      return false;
    }
    const user = { email, name, password, role: 'student', status: 'active', joined: Date.now(), progress: {} };
    await db.put('users', user);
    await db.apiRequest('POST', '/api/users', user);
    await db.logActivity(email, 'Register', 'New account created');
    this.trackEvent('sign_up', { method: 'email' });
    this.toast('Account created! Please log in.', 'success');
    this.navigate('login');
    return true;
  },

  logout() {
    if (this.currentUser) db.logActivity(this.currentUser.email, 'Logout', 'User logged out');
    this.currentUser = null;
    sessionStorage.removeItem('currentUser');
    this.cart = [];
    localStorage.removeItem('cart');
    this.updateNav();
    this.toast('Logged out successfully', 'info');
    this.navigate('home');
  },

  async updateProfile(data) {
    if (!this.currentUser) return;
    const user = await db.get('users', this.currentUser.email);
    Object.assign(user, data);
    await db.put('users', user);
    await db.apiRequest('PUT', `/api/users/${user.email}`, user);
    this.currentUser = user;
    sessionStorage.setItem('currentUser', JSON.stringify(user));
    this.toast('Profile updated!', 'success');
  },

  updateNav() {
    const loggedIn = !!this.currentUser;
    const isAdmin = loggedIn && this.currentUser.role === 'admin';
    document.getElementById('navLogin').style.display = loggedIn ? 'none' : '';
    document.getElementById('navLogout').style.display = loggedIn ? '' : 'none';
    document.getElementById('navProfile').style.display = loggedIn ? '' : 'none';
    document.getElementById('navDashboard').style.display = loggedIn ? '' : 'none';
    document.getElementById('navAdmin').style.display = isAdmin ? '' : 'none';
    this.updateCartBadge();
  },

  updateCartBadge() {
    const badge = document.getElementById('cartBadge');
    if (this.cart.length > 0) { badge.textContent = this.cart.length; badge.style.display = ''; }
    else badge.style.display = 'none';
  },

  // ==================== NAVIGATION ====================
  navigate(page, params = {}) {
    this.currentPage = page;
    window.scrollTo(0, 0);
    this.trackPageView(page);
    const appEl = document.getElementById('app');
    const settings = db.getSettings();

    switch (page) {
      case 'home': appEl.innerHTML = this.renderHome(); break;
      case 'courses': appEl.innerHTML = this.renderCourses(); break;
      case 'course': appEl.innerHTML = this.renderCourseDetail(params.id); break;
      case 'cart': appEl.innerHTML = this.renderCart(); break;
      case 'checkout': appEl.innerHTML = this.renderCheckout(); setTimeout(() => this.initPayPal(), 500); break;
      case 'login': appEl.innerHTML = this.renderLogin(); break;
      case 'register': appEl.innerHTML = this.renderRegister(); break;
      case 'dashboard': appEl.innerHTML = this.renderDashboard(); break;
      case 'profile': appEl.innerHTML = this.renderProfile(); break;
      case 'lesson': appEl.innerHTML = this.renderLesson(params.courseId, params.lessonId); break;
      case 'certificate': appEl.innerHTML = this.renderCertificate(params.id); break;
      case 'admin': appEl.innerHTML = this.renderAdmin(params.tab || 'overview'); break;
      default: appEl.innerHTML = this.renderHome();
    }

    // Re-attach event listeners for dynamic content
    if (page === 'courses') this.attachCourseFilters();
    if (page === 'admin') this.attachAdminEvents(params.tab || 'overview');
    if (page === 'dashboard') this.attachDashboardEvents();
    if (page === 'home') this.attachHomeEvents();
  },

  toggleMobileMenu() {
    const links = document.getElementById('navLinks');
    links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
    if (links.style.display === 'flex') {
      links.style.position = 'absolute';
      links.style.top = '60px';
      links.style.left = '0';
      links.style.right = '0';
      links.style.background = 'var(--white)';
      links.style.flexDirection = 'column';
      links.style.padding = '1rem';
      links.style.boxShadow = 'var(--shadow-lg)';
    }
  },

  toast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
  },

  formatDate(ts) {
    return new Date(ts).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  },

  formatCurrency(n) {
    return '$' + parseFloat(n).toFixed(2);
  }
};

app.attachCourseFilters = async function() {
  const render = async () => {
    const search = document.getElementById('courseSearch').value.toLowerCase();
    const category = document.getElementById('courseCategory').value;
    const sort = document.getElementById('courseSort').value;
    let courses = await db.getAll('courses');
    if (search) courses = courses.filter(c => c.title.toLowerCase().includes(search) || c.description.toLowerCase().includes(search));
    if (category) courses = courses.filter(c => c.category === category);
    if (sort === 'az') courses.sort((a, b) => a.title.localeCompare(b.title));
    if (sort === 'za') courses.sort((a, b) => b.title.localeCompare(a.title));
    if (sort === 'newest') courses.sort((a, b) => b.createdAt - a.createdAt);
    if (sort === 'oldest') courses.sort((a, b) => a.createdAt - b.createdAt);

    const grid = document.getElementById('coursesGrid');
    if (grid) {
      grid.innerHTML = courses.map(c => `
        <div class="course-card" onclick="app.navigate('course', {id:${c.id}})">
          <div class="course-image">${c.image}</div>
          <div class="course-body">
            <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem">
              <span class="badge badge-info">${c.category}</span>
            </div>
            <div class="course-title">${c.title}</div>
            <p class="text-gray text-sm" style="margin-bottom:0.75rem">${c.description}</p>
            <div class="course-meta"><span>${c.lessons.length} lessons</span></div>
            <div class="flex-between">
              <span class="price-tag">$${c.price.toFixed(2)}</span>
              <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();app.addToCart(${c.id})">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }
  };

  document.getElementById('courseSearch').addEventListener('input', render);
  document.getElementById('courseCategory').addEventListener('change', render);
  document.getElementById('courseSort').addEventListener('change', render);
  render();
};

app.hasCourseAccess = async function(courseId) {
  if (!this.currentUser) return false;
  const purchases = await db.query('purchases', 'userEmail', this.currentUser.email);
  return purchases.some(p => p.courseId == courseId && p.status === 'completed');
};

app.getPurchaseType = async function(courseId) {
  if (!this.currentUser) return null;
  const purchases = await db.query('purchases', 'userEmail', this.currentUser.email);
  const p = purchases.find(p => p.courseId == courseId && p.status === 'completed');
  return p ? p.type : null;
};

// ==================== STRIPE PAYMENT ====================
app.payWithStripe = async function() {
  if (!this.currentUser) { this.toast('Please log in first', 'error'); this.navigate('login'); return; }
  if (this.cart.length === 0) { this.toast('Cart is empty', 'error'); return; }

  const items = this.cart.map(item => ({
    courseId: item.courseId,
    type: item.type,
    title: item.title,
    price: item.price
  }));

  this.toast('Redirecting to secure payment...', 'info');
  try {
    const apiUrl = db.apiBase.replace('/rest/v1', '');
    const response = await fetch(`${apiUrl}/functions/v1/stripe-checkout`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${db.supabaseKey || ''}`
      },
      body: JSON.stringify({
        items,
        userEmail: this.currentUser.email,
        successUrl: `${window.location.origin}${window.location.pathname}?payment=success&provider=stripe`,
        cancelUrl: `${window.location.origin}${window.location.pathname}?payment=cancel`
      })
    });
    const data = await response.json();
    if (data.url) {
      // Save cart to sessionStorage for post-payment recovery
      sessionStorage.setItem('pendingCart', JSON.stringify(this.cart));
      window.location.href = data.url;
    } else {
      this.toast(data.error || 'Payment initialization failed', 'error');
    }
  } catch (e) {
    this.toast('Payment error: ' + e.message, 'error');
  }
};

app.showMpesaForm = function() {

app.payWithMpesa = async function() {
  const phone = document.getElementById('mpesaPhone').value.trim();
  const sandbox = document.getElementById('mpesaSandbox').checked;
  if (!phone || phone.length < 10) { this.toast('Enter valid phone number with country code', 'error'); return; }

  const total = this.cart.reduce((s, i) => s + i.price, 0);
  const items = this.cart.map(item => ({ courseId: item.courseId, type: item.type, title: item.title, price: item.price }));

  this.toast('Sending STK push to your phone...', 'info');
  try {
    const apiUrl = db.apiBase.replace('/rest/v1', '');
    const response = await fetch(`${apiUrl}/functions/v1/mpesa-stk`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${db.supabaseKey || ''}`
      },
      body: JSON.stringify({ phone, amount: total, items, userEmail: this.currentUser.email, sandbox })
    });
    const data = await response.json();
    if (data.success && data.checkoutRequestId) {
      sessionStorage.setItem('pendingCart', JSON.stringify(this.cart));
      document.getElementById('mpesaModal').classList.add('hidden');
      this.toast('✅ STK push sent! Enter your M-Pesa PIN on your phone.', 'success');
      this.pollMpesaStatus(data.checkoutRequestId);
    } else {
      this.toast(data.error || 'M-Pesa request failed', 'error');
    }
  } catch (e) {
    this.toast('M-Pesa error: ' + e.message, 'error');
  }
};

app.pollMpesaStatus = async function(checkoutRequestId) {
  let attempts = 0;
  const interval = setInterval(async () => {
    attempts++;
    if (attempts > 40) {
      clearInterval(interval);
      this.toast('⏱ Payment check timed out. Check your M-Pesa messages. If paid, your courses will appear shortly.', 'warning');
      return;
    }
    try {
      const apiUrl = db.apiBase.replace('/rest/v1', '');
      const res = await fetch(`${apiUrl}/functions/v1/mpesa-status?checkoutRequestId=${checkoutRequestId}`, {
        headers: { 'Authorization': `Bearer ${db.supabaseKey || ''}` }
      });
      const data = await res.json();
      if (data.status === 'completed') {
        clearInterval(interval);
        const pendingCart = JSON.parse(sessionStorage.getItem('pendingCart') || '[]');
        for (const item of pendingCart) {
          const purchase = { userEmail: this.currentUser.email, courseId: item.courseId, type: item.type, amount: item.price, date: Date.now(), status: 'completed', provider: 'mpesa' };
          await db.put('purchases', purchase);
          await db.apiRequest('POST', '/purchases', purchase);
        }
        sessionStorage.removeItem('pendingCart');
        const totalMpesa = pendingCart.reduce((s, i) => s + i.price, 0);
        this.trackPurchase('mpesa', pendingCart, totalMpesa);
        this.cart = []; localStorage.removeItem('cart'); this.updateCartBadge();
        this.toast('🎉 M-Pesa payment successful! Courses added.', 'success');
        this.navigate('dashboard');
      } else if (data.status === 'failed') {
        clearInterval(interval);
        this.toast('❌ Payment failed: ' + (data.reason || 'Cancelled or insufficient funds'), 'error');
      }
    } catch (e) {}
  }, 4000);
};

app.handlePaystackReturn = async function() {
  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref') || sessionStorage.getItem('paystackRef');
  const status = params.get('status');

  if (reference && status === 'success') {
    this.toast('Verifying Paystack payment...', 'info');
    try {
      const apiUrl = db.apiBase.replace('/rest/v1', '');
      const res = await fetch(`${apiUrl}/functions/v1/paystack-verify?reference=${reference}`, {
        headers: { 'Authorization': `Bearer ${db.supabaseKey || ''}` }
      });
      const data = await res.json();

      if (data.success && data.verified) {
        const pendingCart = JSON.parse(sessionStorage.getItem('pendingCart') || '[]');
        for (const item of pendingCart) {
          const purchase = {
            userEmail: this.currentUser.email,
            courseId: item.courseId,
            type: item.type,
            amount: item.price,
            date: Date.now(),
            status: 'completed',
            provider: 'paystack',
            transactionId: reference
          };
          await db.put('purchases', purchase);
          await db.apiRequest('POST', '/purchases', purchase);
        }
        sessionStorage.removeItem('pendingCart');
        sessionStorage.removeItem('paystackRef');
        const totalPs = pendingCart.reduce((s, i) => s + i.price, 0);
        this.trackPurchase('paystack', pendingCart, totalPs);
        this.cart = []; localStorage.removeItem('cart'); this.updateCartBadge();
        window.history.replaceState({}, document.title, window.location.pathname);
        this.toast('🎉 Paystack payment successful!', 'success');
        this.navigate('dashboard');
      } else {
        this.toast('Payment verification failed: ' + (data.message || 'Unknown'), 'error');
      }
    } catch (e) {
      this.toast('Verification error. Contact support.', 'error');
    }
  } else if (status === 'cancelled' || status === 'failed') {
    this.toast('Payment was not completed.', 'warning');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
};

// ==================== PAYMENT RETURN HANDLING ====================
app.handlePaymentReturn = async function() {
  const params = new URLSearchParams(window.location.search);
  const payment = params.get('payment');
  const provider = params.get('provider');
  const sessionId = params.get('session_id');
  const trxref = params.get('trxref');

  // Handle Paystack return first (it uses different params)
  if (trxref || params.get('reference')) {
    await this.handlePaystackReturn();
    return;
  }

  if (payment === 'success' && provider === 'stripe' && sessionId) {
    this.toast('Verifying payment...', 'info');
    try {
      const apiUrl = db.apiBase.replace('/rest/v1', '');
      const res = await fetch(`${apiUrl}/functions/v1/verify-stripe?session_id=${sessionId}`, {
        headers: { 'Authorization': `Bearer ${db.supabaseKey || ''}` }
      });
      const data = await res.json();
      if (data.success && data.items) {
        for (const item of data.items) {
          await db.put('purchases', item);
          await db.apiRequest('POST', '/purchases', item);
        }
        const totalStripe = pendingCart.reduce((s, i) => s + i.price, 0);
        this.trackPurchase('stripe', pendingCart, totalStripe);
        sessionStorage.removeItem('pendingCart');
        this.cart = []; localStorage.removeItem('cart'); this.updateCartBadge();
        this.toast('🎉 Payment successful! Welcome to your courses.', 'success');
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
        this.navigate('dashboard');
      } else {
        this.toast('Payment verification failed. Contact support.', 'error');
      }
    } catch (e) {
      this.toast('Verification error. Refresh or contact support.', 'error');
    }
  } else if (payment === 'cancel') {
    this.toast('Payment was cancelled.', 'info');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
};

app.renderDashboard = async function() {
  if (!this.currentUser) { this.navigate('login'); return ''; }
  const purchases = await db.query('purchases', 'userEmail', this.currentUser.email);
  const courses = await db.getAll('courses');
  const certificates = await db.getAll('certificates');
  const myCerts = certificates.filter(c => c.userEmail === this.currentUser.email);
  const myCourses = purchases.filter(p => p.status === 'completed').map(p => {
    const course = courses.find(c => c.id == p.courseId);
    return { ...p, course };
  }).filter(c => c.course);

  const totalSpent = purchases.reduce((s, p) => s + p.amount, 0);
  const completedLessons = Object.values(this.currentUser.progress || {}).reduce((s, p) => s + (p.completed ? p.completed.length : 0), 0);

  return `
  <div class="section">
    <div class="container">
      <h1 style="font-size:2rem;font-weight:800;margin-bottom:0.5rem">Welcome, ${this.currentUser.name}</h1>
      <p class="text-gray mb-2">Here's your learning progress at a glance.</p>
      <div class="grid grid-4" style="margin-bottom:2rem">
        <div class="stat-card">
          <div class="stat-value">${myCourses.length}</div>
          <div class="stat-label">Courses Enrolled</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${completedLessons}</div>
          <div class="stat-label">Lessons Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${myCerts.length}</div>
          <div class="stat-label">Certificates</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">$${totalSpent.toFixed(2)}</div>
          <div class="stat-label">Total Spent</div>
        </div>
      </div>

      <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:1rem">My Courses</h2>
      ${myCourses.length === 0 ? `
        <div class="card text-center">
          <div style="font-size:3rem;margin-bottom:1rem">📚</div>
          <h3>No courses yet</h3>
          <p class="text-gray mb-2">Start your learning journey today.</p>
          <button class="btn btn-primary" onclick="app.navigate('courses')">Browse Courses</button>
        </div>
      ` : `
        <div class="grid grid-2">
          ${myCourses.map(c => {
            const prog = this.currentUser.progress && this.currentUser.progress[c.courseId];
            const pct = prog && c.course ? Math.round((prog.completed.length / c.course.lessons.length) * 100) : 0;
            const isCert = myCerts.find(cert => cert.courseId == c.courseId);
            return `
              <div class="card">
                <div style="display:flex;gap:1rem;align-items:flex-start">
                  <div style="font-size:3rem;width:80px;height:80px;background:var(--light);border-radius:0.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0">${c.course.image}</div>
                  <div style="flex:1;min-width:0">
                    <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:0.25rem">${c.course.title}</h3>
                    <div class="flex-between text-sm mb-1">
                      <span class="text-gray">${pct}% complete</span>
                      <span class="badge ${c.type === 'certificate' ? 'badge-success' : c.type === 'full' ? 'badge-info' : 'badge-warning'}">${c.type === 'certificate' ? 'Cert' : c.type === 'full' ? 'Full' : 'Read'}</span>
                    </div>
                    <div class="progress-bar mb-2"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                    <div style="display:flex;gap:0.5rem">
                      <button class="btn btn-sm btn-primary" onclick="app.navigate('course', {id:${c.courseId}})">Continue</button>
                      ${pct >= 100 && c.type === 'certificate' && !isCert ? `<button class="btn btn-sm btn-secondary" onclick="app.generateCertificate(${c.courseId})">Get Certificate</button>` : ''}
                      ${isCert ? `<button class="btn btn-sm btn-outline" onclick="app.navigate('certificate', {id:'${isCert.uniqueId}'})">View Certificate</button>` : ''}
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}

      <h2 style="font-size:1.5rem;font-weight:700;margin:2rem 0 1rem">Purchase History</h2>
      <div class="card" style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Course</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
          <tbody>
            ${purchases.map(p => {
              const course = courses.find(c => c.id == p.courseId);
              return `<tr><td>${course ? course.title : 'Unknown'}</td><td><span class="badge ${p.type === 'certificate' ? 'badge-success' : p.type === 'full' ? 'badge-info' : 'badge-warning'}">${p.type}</span></td><td>$${p.amount.toFixed(2)}</td><td>${app.formatDate(p.date)}</td><td><span class="badge badge-success">${p.status}</span></td></tr>`;

app.renderLesson = async function(courseId, lessonId) {
  if (!this.currentUser) { this.navigate('login'); return ''; }
  const hasAccess = await this.hasCourseAccess(courseId);
  if (!hasAccess) { this.toast('Purchase required', 'error'); this.navigate('course', {id: courseId}); return ''; }
  const course = await db.get('courses', courseId);
  const lesson = course.lessons.find(l => l.id == lessonId);
  const lessonIndex = course.lessons.findIndex(l => l.id == lessonId);
  const prevLesson = lessonIndex > 0 ? course.lessons[lessonIndex - 1] : null;
  const nextLesson = lessonIndex < course.lessons.length - 1 ? course.lessons[lessonIndex + 1] : null;
  const purchaseType = await this.getPurchaseType(courseId);
  const isReadOnly = purchaseType === 'readonly';

  return `
  <div class="section">
    <div class="container">
      <div style="margin-bottom:1rem">
        <button class="btn btn-sm btn-outline" onclick="app.navigate('course', {id:${courseId}})">← Back to Course</button>
      </div>
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem">${lesson.title}</h1>
      <p class="text-gray mb-2">${course.title} • Lesson ${lessonIndex + 1} of ${course.lessons.length}</p>
      <div class="lesson-player" id="videoPlayer" style="position:relative">
        <video id="lessonVideo" style="width:100%;height:100%;object-fit:cover;border-radius:0.75rem;display:none" controls preload="metadata" playsinline>
          <source src="${lesson.videoUrl || ''}" type="video/mp4">
          <p>Your browser does not support HTML5 video. <a href="${lesson.videoUrl || '#'}">Download</a></p>
        </video>
        <div id="videoOverlay" style="position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0.75rem" onclick="app.playLessonVideo()">
          <div style="text-align:center;color:white">
            <div style="font-size:4rem;margin-bottom:1rem">▶️</div>
            <div style="font-size:1.25rem;font-weight:600">Click to Play</div>
            <div class="text-sm" style="opacity:0.8">${lesson.duration}</div>
            ${lesson.videoUrl ? '' : '<div class="text-sm" style="opacity:0.6;margin-top:0.5rem">(Demo mode - no video uploaded)</div>'}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap">
        ${!isReadOnly ? `
          <button class="btn btn-success" onclick="app.markComplete(${courseId}, ${lessonId})">✓ Mark Complete</button>
          <button class="btn btn-outline" onclick="app.toast('Download started', 'success')">⬇ Download</button>
          <button class="btn btn-outline" onclick="window.print()">🖨 Print</button>
          <button class="btn btn-outline" onclick="app.toast('Link copied!', 'success')">🔗 Share</button>
        ` : `
          <span class="badge badge-warning">Read-Only Mode — Upgrade for downloads & certificates</span>
        `}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:2rem">
        ${prevLesson ? `<button class="btn btn-outline" onclick="app.navigate('lesson', {courseId:${courseId},lessonId:${prevLesson.id}})">← ${prevLesson.title}</button>` : '<span></span>'}
        ${nextLesson ? `<button class="btn btn-primary" onclick="app.navigate('lesson', {courseId:${courseId},lessonId:${nextLesson.id}})">${nextLesson.title} →</button>` : '<span></span>'}
      </div>
    </div>
  </div>`;
};

app.playLessonVideo = function() {
  const video = document.getElementById('lessonVideo');
  const overlay = document.getElementById('videoOverlay');
  if (!video || !video.src || video.src === window.location.href) {
    this.toast('No video available for this lesson yet.', 'warning');
    return;
  }
  overlay.style.display = 'none';
  video.style.display = 'block';
  video.play().catch(() => {});
};

app.markComplete = async function(courseId, lessonId) {
  const user = await db.get('users', this.currentUser.email);
  if (!user.progress) user.progress = {};
  if (!user.progress[courseId]) user.progress[courseId] = { completed: [], total: 0 };
  if (!user.progress[courseId].completed.includes(lessonId)) {
    user.progress[courseId].completed.push(lessonId);
  }
  const course = await db.get('courses', courseId);
  user.progress[courseId].total = course.lessons.length;
  await db.put('users', user);
  await db.apiRequest('PUT', `/api/users/${user.email}`, user);
  this.currentUser = user;
  sessionStorage.setItem('currentUser', JSON.stringify(user));
  this.toast('Lesson completed!', 'success');

  // Check if course fully completed
  if (user.progress[courseId].completed.length === course.lessons.length) {
    this.toast('🎉 Course completed!', 'success');
    await db.logActivity(user.email, 'Course Completed', course.title);
  }
};

app.generateCertificate = async function(courseId) {
  const course = await db.get('courses', courseId);
  const uniqueId = 'RAS-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 9000) + 1000);
  const cert = {
    uniqueId,
    userEmail: this.currentUser.email,
    userName: this.currentUser.name,
    courseId,
    courseTitle: course.title,
    issueDate: Date.now()
  };
  await db.put('certificates', cert);
  await db.apiRequest('POST', '/api/certificates', cert);
  await db.logActivity(this.currentUser.email, 'Certificate Issued', `${course.title} — ${uniqueId}`);
  this.toast('Certificate generated!', 'success');
  this.navigate('certificate', { id: uniqueId });
};

app.renderVerifyCertificate = async function(uniqueId) {
  // Support both direct param and URL query
  if (!uniqueId) {
    const params = new URLSearchParams(window.location.search);
    uniqueId = params.get('verify') || params.get('id');
  }

  if (!uniqueId) {
    return `
    <div class="section">
      <div class="container" style="max-width:600px">
        <div class="card text-center">
          <div style="font-size:4rem;margin-bottom:1rem">🔍</div>
          <h2 style="margin-bottom:0.5rem">Verify Certificate</h2>
          <p class="text-gray mb-2">Enter a certificate ID to verify its authenticity.</p>
          <div class="form-group">
            <input type="text" class="form-control" id="verifyCertId" placeholder="RAS-2026-001" style="text-align:center;font-size:1.125rem;letter-spacing:0.1em">
          </div>
          <button class="btn btn-primary w-full" onclick="app.navigate('verify-cert', {id: document.getElementById('verifyCertId').value.trim()})">Verify</button>
        </div>
      </div>
    </div>`;
  }

  // Try local first, then API
  let cert = await db.get('certificates', uniqueId);

  // If not in local DB and we have API, try Supabase
  if (!cert && db.apiBase) {
    try {
      const res = await fetch(`${db.apiBase}/certificates?unique_id=eq.${uniqueId}`, {
        headers: { 'Authorization': `Bearer ${db.supabaseKey || ''}`, 'apikey': db.supabaseKey || '' }
      });
      const data = await res.json();
      if (data && data.length > 0) {
        cert = data[0];
        // Cache locally
        await db.put('certificates', cert);
      }
    } catch (e) {}
  }

  if (!cert) {
    return `
    <div class="section">
      <div class="container" style="max-width:600px">
        <div class="card text-center">
          <div style="font-size:4rem;margin-bottom:1rem">❌</div>

          <button class="btn btn-outline" onclick="app.navigate('verify-cert')">Try Another ID</button>
        </div>
      </div>
    </div>`;
  }

  const isValid = cert.issueDate && cert.userName && cert.courseTitle;
  const verifyUrl = `${window.location.origin}${window.location.pathname}?verify=${uniqueId}`;

  return `
  <div class="section">
    <div class="container" style="max-width:800px">
      <div class="card text-center" style="border:3px solid ${isValid ? 'var(--success)' : 'var(--danger)'};padding:3rem">
        <div style="font-size:4rem;margin-bottom:1rem">${isValid ? '✅' : '⚠️'}</div>
        <h1 style="font-size:2rem;font-weight:800;margin-bottom:0.5rem;color:${isValid ? 'var(--success)' : 'var(--danger)'}">
          ${isValid ? 'Certificate Verified' : 'Verification Issue'}
        </h1>
        <p class="text-gray mb-2">This certificate has been verified in the Rise Africa Skills database.</p>

        <div style="background:var(--light);border-radius:0.75rem;padding:2rem;margin:2rem 0;text-align:left">
          <div style="display:flex;gap:2rem;flex-wrap:wrap;justify-content:center">
            <div style="text-align:center">
              <div class="text-gray text-sm">Recipient</div>
              <div style="font-size:1.5rem;font-weight:700;color:var(--primary)">${cert.userName || 'Unknown'}</div>
            </div>
            <div style="text-align:center">
              <div class="text-gray text-sm">Course</div>
              <div style="font-size:1.25rem;font-weight:700">${cert.courseTitle || 'Unknown'}</div>
            </div>
            <div style="text-align:center">
              <div class="text-gray text-sm">Issued</div>
              <div style="font-size:1.25rem;font-weight:700">${cert.issueDate ? app.formatDate(cert.issueDate) : 'Unknown'}</div>
            </div>
            <div style="text-align:center">
              <div class="text-gray text-sm">Certificate ID</div>
              <div style="font-size:1.125rem;font-weight:700;font-family:monospace">${cert.uniqueId}</div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="window.print()">🖨 Print</button>
          <button class="btn btn-outline" onclick="app.toast('Link copied!', 'success')">🔗 Copy Link</button>
          <button class="btn btn-primary" onclick="app.navigate('verify-cert')">Verify Another</button>
        </div>

        <p class="text-gray text-xs mt-2">Verified by Rise Africa Skills on ${new Date().toLocaleDateString()}</p>

app.sendPasswordReset = async function() {
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) { this.toast('Please enter your email', 'error'); return; }

  const user = await db.get('users', email);
  if (!user) {
    // Don't reveal if email exists (security)
    this.toast('If this email is registered, you will receive a reset link shortly.', 'success');
    return;
  }

  this.toast('Sending reset link...', 'info');
  try {
    const apiUrl = db.apiBase.replace('/rest/v1', '');
    const res = await fetch(`${apiUrl}/functions/v1/send-email`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${db.supabaseKey || ''}`
      },
      body: JSON.stringify({ type: 'password-reset', email, siteUrl: window.location.origin + window.location.pathname })
    });
    const data = await res.json();
    if (data.success) {
      this.toast('✅ Reset link sent! Check your email.', 'success');
    } else {
      this.toast(data.error || 'Failed to send email. Try again later.', 'error');
    }
  } catch (e) {
    this.toast('Email service unavailable. Contact support.', 'error');
  }
};

app.resetPassword = async function(token) {
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (!password || password.length < 6) { this.toast('Password must be at least 6 characters', 'error'); return; }
  if (password !== confirm) { this.toast('Passwords do not match', 'error'); return; }

  try {
    const apiUrl = db.apiBase.replace('/rest/v1', '');
    const res = await fetch(`${apiUrl}/functions/v1/reset-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${db.supabaseKey || ''}`
      },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (data.success) {
      this.toast('✅ Password updated! Please log in.', 'success');
      this.navigate('login');
    } else {
      this.toast(data.error || 'Invalid or expired token', 'error');
    }
  } catch (e) {
    this.toast('Service unavailable. Try again later.', 'error');
  }
};

// ==================== GOOGLE OAUTH ====================
app.handleGoogleSignIn = async function(response) {
  const credential = response.credential;
  if (!credential) { app.toast('Google sign-in failed', 'error'); return; }

  app.toast('Signing in with Google...', 'info');
  try {
    const apiUrl = db.apiBase.replace('/rest/v1', '');
    const res = await fetch(`${apiUrl}/functions/v1/google-auth`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${db.supabaseKey || ''}`
      },
      body: JSON.stringify({ credential })
    });
    const data = await res.json();

    if (data.success && data.user) {
      // Save user locally
      const user = {
        email: data.user.email,
        name: data.user.name,
        password: 'google-oauth-' + Math.random().toString(36).slice(2),
        role: data.user.role || 'student',
        status: 'active',
        joined: data.user.joined || Date.now(),
        progress: data.user.progress || {}
      };
      await db.put('users', user);
      app.currentUser = user;
      sessionStorage.setItem('currentUser', JSON.stringify(user));
      app.updateNav();
      await db.logActivity(user.email, 'Login', 'Google OAuth sign-in');
      app.trackEvent('login', { method: 'google' });
      app.toast(`Welcome, ${user.name}!`, 'success');
      app.navigate('dashboard');
    } else {
      app.toast(data.error || 'Google sign-in failed', 'error');
    }
  } catch (e) {
    app.toast('Google sign-in error: ' + e.message, 'error');
  }
};

app.attachAdminEvents = async function(tab) {
  const content = document.getElementById('adminContent');
  if (!content) return;

  if (tab === 'overview') {
    const users = await db.getAll('users');
    const courses = await db.getAll('courses');
    const purchases = await db.getAll('purchases');
    const logs = await db.getAll('activity_log');
    const last7 = purchases.filter(p => p.date > Date.now() - 86400000 * 7);
    const revenue7 = last7.reduce((s, p) => s + p.amount, 0);
    const topCourses = {};
    purchases.forEach(p => { topCourses[p.courseId] = (topCourses[p.courseId] || 0) + 1; });
    const top5 = Object.entries(topCourses).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, count]) => {
      const c = courses.find(c => c.id == id);
      return { title: c ? c.title : 'Unknown', count };
    });

    content.innerHTML = `
      <div class="grid grid-4" style="margin-bottom:2rem">
        <div class="stat-card"><div class="stat-value">${users.length}</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value">${courses.length}</div><div class="stat-label">Courses</div></div>
        <div class="stat-card"><div class="stat-value">${purchases.length}</div><div class="stat-label">Transactions</div></div>
        <div class="stat-card"><div class="stat-value">$${revenue7.toFixed(2)}</div><div class="stat-label">Revenue (7d)</div></div>
      </div>
      <div class="grid grid-2">
        <div class="card">
          <h3 style="margin-bottom:1rem">Revenue (Last 7 Days)</h3>
          <div style="display:flex;align-items:flex-end;gap:0.5rem;height:200px;padding-top:1rem">
            ${[6,5,4,3,2,1,0].map(d => {
              const dayStart = Date.now() - 86400000 * d;
              const dayEnd = dayStart + 86400000;
              const dayPurchases = purchases.filter(p => p.date >= dayStart && p.date < dayEnd);
              const dayRev = dayPurchases.reduce((s, p) => s + p.amount, 0);
              const maxRev = Math.max(...[6,5,4,3,2,1,0].map(d2 => {
                const ds = Date.now() - 86400000 * d2;
                const de = ds + 86400000;
                return purchases.filter(p => p.date >= ds && p.date < de).reduce((s, p) => s + p.amount, 0);
              }));
              const height = maxRev > 0 ? (dayRev / maxRev) * 100 : 0;
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0.25rem">
                <div style="width:100%;background:var(--primary);border-radius:0.25rem;transition:height 0.3s;height:${Math.max(height, 5)}%"></div>
                <span style="font-size:0.625rem;color:var(--gray)">${new Date(dayStart).toLocaleDateString('en-US', {weekday:'short'})}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:1rem">Top 5 Courses</h3>
          ${top5.map((c, i) => `
            <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">
              <span style="width:24px;height:24px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700">${i+1}</span>
              <span style="flex:1;font-size:0.875rem">${c.title}</span>
              <span class="badge badge-info">${c.count} sales</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card mt-2">
        <h3 style="margin-bottom:1rem">Recent Activity</h3>
        <div style="max-height:300px;overflow-y:auto">
          ${logs.slice().sort((a, b) => b.time - a.time).slice(0, 10).map(l => `
            <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0;border-bottom:1px solid var(--border)">
              <span class="text-gray text-xs" style="white-space:nowrap">${app.formatDate(l.time)}</span>

              <span style="font-size:0.875rem">${l.action}</span>
              <span class="text-gray text-sm" style="flex:1;text-align:right">${l.details}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  if (tab === 'users') {
    this.renderUsersTab(content);
  }
  if (tab === 'courses') {
    this.renderCoursesTab(content);
  }
  if (tab === 'transactions') {
    this.renderTransactionsTab(content);
  }
  if (tab === 'analytics') {
    this.renderAnalyticsTab(content);
  }
  if (tab === 'ga4') {

};

app.saveUser = async function(email) {
  const name = document.getElementById('modalUserName').value;
  const newEmail = document.getElementById('modalUserEmail').value;
  const password = document.getElementById('modalUserPassword').value;
  const role = document.getElementById('modalUserRole').value;
  if (!name || !newEmail) { this.toast('Name and email required', 'error'); return; }

  if (email) {
    const user = await db.get('users', email);
    user.name = name; user.role = role;
    if (password) user.password = password;
    await db.put('users', user);
    await db.apiRequest('PUT', `/api/users/${email}`, user);
    await db.logActivity(this.currentUser.email, 'User Updated', name);
  } else {
    const existing = await db.get('users', newEmail);
    if (existing) { this.toast('Email already exists', 'error'); return; }
    const user = { email: newEmail, name, password: password || 'password', role, status: 'active', joined: Date.now(), progress: {} };
    await db.put('users', user);
    await db.apiRequest('POST', '/api/users', user);
    await db.logActivity(this.currentUser.email, 'User Created', name);
  }
  document.querySelector('.modal-overlay').remove();
  this.toast('User saved!', 'success');
  this.navigate('admin', {tab:'users'});
};

app.editUser = async function(email) {
  const user = await db.get('users', email);
  this.openUserModal(user);
};

app.toggleUserStatus = async function(email) {
  const user = await db.get('users', email);
  user.status = user.status === 'active' ? 'banned' : 'active';
  await db.put('users', user);
  await db.apiRequest('PUT', `/api/users/${email}`, user);
  await db.logActivity(this.currentUser.email, user.status === 'active' ? 'User Unbanned' : 'User Banned', user.name);
  this.toast(`User ${user.status === 'active' ? 'unbanned' : 'banned'}`, 'success');
  this.navigate('admin', {tab:'users'});
};

app.deleteUser = async function(email) {
  if (!confirm('Are you sure? This cannot be undone.')) return;
  await db.delete('users', email);
  await db.apiRequest('DELETE', `/api/users/${email}`);
  await db.logActivity(this.currentUser.email, 'User Deleted', email);
  this.toast('User deleted', 'success');
  this.navigate('admin', {tab:'users'});
};

app.renderPagination = function(total) {

  const course = id ? await db.get('courses', id) : { createdAt: Date.now() };
  course.title = title; course.category = category; course.image = image; course.description = description; course.lessons = lessons;
  await db.put('courses', course);
  await db.apiRequest(id ? 'PUT' : 'POST', id ? `/api/courses/${id}` : '/api/courses', course);
  await db.logActivity(this.currentUser.email, id ? 'Course Updated' : 'Course Created', title);
  document.querySelector('.modal-overlay').remove();
  this.toast('Course saved!', 'success');
  this.navigate('admin', {tab:'courses'});
};

app.renderTransactionsTab = async function(container) {
  let purchases = await db.getAll('purchases');
  const users = await db.getAll('users');
  const courses = await db.getAll('courses');

  if (this.filters.search) purchases = purchases.filter(p => {
    const user = users.find(u => u.email === p.userEmail);
    const course = courses.find(c => c.id == p.courseId);
    return (user && user.name.toLowerCase().includes(this.filters.search.toLowerCase())) ||
           (course && course.title.toLowerCase().includes(this.filters.search.toLowerCase())) ||
           String(p.id).includes(this.filters.search);
  });
  if (this.filters.type) purchases = purchases.filter(p => p.type === this.filters.type);
  if (this.filters.dateFrom) purchases = purchases.filter(p => p.date >= new Date(this.filters.dateFrom).getTime());
  if (this.filters.dateTo) purchases = purchases.filter(p => p.date <= new Date(this.filters.dateTo).getTime() + 86400000);

  const totalRev = purchases.reduce((s, p) => s + p.amount, 0);
  const avg = purchases.length > 0 ? totalRev / purchases.length : 0;

  container.innerHTML = `
    <div class="card" style="margin-bottom:1rem">
      <div class="grid grid-4" style="gap:1rem">
        <div class="search-box"><input type="text" class="form-control" id="txSearch" placeholder="Search user/course/ID..." value="${this.filters.search}"></div>
        <select class="form-control" id="txType"><option value="">All Types</option><option value="readonly">Read-Only</option><option value="full">Full</option><option value="certificate">Certificate</option></select>
        <input type="date" class="form-control" id="txFrom" value="${this.filters.dateFrom}">
        <input type="date" class="form-control" id="txTo" value="${this.filters.dateTo}">
      </div>
    </div>
    <div class="grid grid-3" style="margin-bottom:1rem">
      <div class="stat-card"><div class="stat-value">${purchases.length}</div><div class="stat-label">Transactions</div></div>
      <div class="stat-card"><div class="stat-value">$${totalRev.toFixed(2)}</div><div class="stat-label">Total Revenue</div></div>
      <div class="stat-card"><div class="stat-value">$${avg.toFixed(2)}</div><div class="stat-label">Average</div></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table class="table">
        <thead><tr><th>ID</th><th>User</th><th>Course</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${purchases.map(p => {
            const user = users.find(u => u.email === p.userEmail);
            const course = courses.find(c => c.id == p.courseId);
            return `<tr>
              <td>#${p.id}</td>
              <td>${user ? user.name : p.userEmail}</td>
              <td>${course ? course.title : 'Unknown'}</td>
              <td><span class="badge ${p.type === 'certificate' ? 'badge-success' : p.type === 'full' ? 'badge-info' : 'badge-warning'}">${p.type}</span></td>
              <td>$${p.amount.toFixed(2)}</td>
              <td>${app.formatDate(p.date)}</td>
              <td><span class="badge ${p.status === 'completed' ? 'badge-success' : p.status === 'refunded' ? 'badge-danger' : 'badge-warning'}">${p.status}</span></td>
              <td>${p.status === 'completed' ? `<button class="btn btn-sm btn-danger" onclick="app.refundTransaction(${p.id})">Refund</button>` : '<span class="text-gray text-sm">—</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('txSearch').addEventListener('input', (e) => { this.filters.search = e.target.value; this.renderTransactionsTab(container); });
  document.getElementById('txType').addEventListener('change', (e) => { this.filters.type = e.target.value; this.renderTransactionsTab(container); });
  document.getElementById('txFrom').addEventListener('change', (e) => { this.filters.dateFrom = e.target.value; this.renderTransactionsTab(container); });
  document.getElementById('txTo').addEventListener('change', (e) => { this.filters.dateTo = e.target.value; this.renderTransactionsTab(container); });
};

app.refundTransaction = async function(id) {
  if (!confirm('Refund this transaction?')) return;
  const purchases = await db.getAll('purchases');
  const p = purchases.find(p => p.id == id);
  if (!p) return;
  p.status = 'refunded';
  await db.put('purchases', p);
  await db.apiRequest('PUT', `/api/purchases/${id}`, p);
  await db.logActivity(this.currentUser.email, 'Transaction Refunded', `ID: ${id}`);
  this.toast('Transaction refunded', 'success');
  this.navigate('admin', {tab:'transactions'});
};

app.renderAnalyticsTab = async function(container) {
  const purchases = await db.getAll('purchases');
  const courses = await db.getAll('courses');
  const users = await db.getAll('users');

  const salesByCourse = {};
  purchases.forEach(p => { salesByCourse[p.courseId] = (salesByCourse[p.courseId] || 0) + p.amount; });
  const courseSales = Object.entries(salesByCourse).map(([id, amount]) => {
    const c = courses.find(c => c.id == id);
    return { title: c ? c.title : 'Unknown', amount };
  }).sort((a, b) => b.amount - a.amount);
  const maxCourseSales = Math.max(...courseSales.map(c => c.amount), 1);

  const salesByType = { readonly: 0, full: 0, certificate: 0 };
  purchases.forEach(p => { if (salesByType[p.type] !== undefined) salesByType[p.type] += p.amount; });

  const userGrowth = {};
  users.forEach(u => {
    const month = new Date(u.joined).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    userGrowth[month] = (userGrowth[month] || 0) + 1;
  });
  const growthMonths = Object.entries(userGrowth).sort((a, b) => new Date(a[0]) - new Date(b[0]));
  const maxGrowth = Math.max(...growthMonths.map(m => m[1]), 1);

  const completionRates = courses.map(c => {
    const coursePurchases = purchases.filter(p => p.courseId == c.id);
    const completed = coursePurchases.filter(p => {
      const user = users.find(u => u.email === p.userEmail);
      return user && user.progress && user.progress[c.id] && user.progress[c.id].completed.length === c.lessons.length;
    }).length;
    return { title: c.title, rate: coursePurchases.length > 0 ? Math.round((completed / coursePurchases.length) * 100) : 0 };
  });

  container.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-bottom:1rem">Sales by Course</h3>
        ${courseSales.map(c => `
          <div style="margin-bottom:0.75rem">
            <div class="flex-between text-sm mb-1"><span>${c.title}</span><span style="font-weight:600">$${c.amount.toFixed(2)}</span></div>
            <div class="chart-bar"><div class="chart-bar-fill" style="width:${(c.amount / maxCourseSales) * 100}%"></div></div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <h3 style="margin-bottom:1rem">Sales by Type</h3>
        ${Object.entries(salesByType).map(([type, amount]) => `
          <div style="margin-bottom:0.75rem">
            <div class="flex-between text-sm mb-1"><span>${type === 'readonly' ? 'Read-Only' : type === 'full' ? 'Full Access' : 'Certificate'}</span><span style="font-weight:600">$${amount.toFixed(2)}</span></div>
            <div class="chart-bar"><div class="chart-bar-fill" style="width:${(amount / Math.max(...Object.values(salesByType))) * 100}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="grid grid-2 mt-2">
      <div class="card">
        <h3 style="margin-bottom:1rem">User Growth</h3>
        <div style="display:flex;align-items:flex-end;gap:0.5rem;height:200px;padding-top:1rem">
          ${growthMonths.map(([month, count]) => `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0.25rem">
              <div style="width:100%;background:var(--success);border-radius:0.25rem;height:${(count / maxGrowth) * 100}%"></div>
              <span style="font-size:0.625rem;color:var(--gray);transform:rotate(-45deg);white-space:nowrap">${month}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:1rem">Completion Rates</h3>
        ${completionRates.map(c => `
          <div style="margin-bottom:0.75rem">
            <div class="flex-between text-sm mb-1"><span>${c.title}</span><span style="font-weight:600">${c.rate}%</span></div>
            <div class="chart-bar"><div class="chart-bar-fill" style="width:${c.rate}%;background:${c.rate >= 70 ? 'var(--success)' : c.rate >= 40 ? 'var(--warning)' : 'var(--danger)'}"></div></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
};

app.savePrices = async function() {

    id: 'default',

    full: parseFloat(document.getElementById('priceFull').value),
    certificate: parseFloat(document.getElementById('priceCert').value)
  };

};

app.saveSettings = async function() {
  await db.setSetting('siteName', document.getElementById('settingSiteName').value);
  await db.setSetting('supportEmail', document.getElementById('settingEmail').value);
  await db.setSetting('maintenance', document.getElementById('settingMaintenance').checked);

app.saveGA4Id = function() {
  const id = document.getElementById('ga4Id').value.trim();
  localStorage.setItem('ga4Id', id);
  if (id && typeof gtag === 'function') {
    gtag('config', id);
    this.toast('GA4 ID saved and tracking active!', 'success');
  } else {
    this.toast('GA4 ID saved. Refresh to activate.', 'info');
  }
};

app.saveApiBase = function() {
  const url = document.getElementById('apiBaseUrl').value.trim();
  const key = document.getElementById('supabaseKey').value.trim();
  db.apiBase = url;
  db.supabaseKey = key;
  localStorage.setItem('apiBase', url);
  localStorage.setItem('supabaseKey', key);
  this.toast(url && key ? '✅ Supabase connected. Payments & sync enabled.' : '⚠️ Offline mode. Enter both URL and key.', url && key ? 'success' : 'warning');

app.exportData = async function() {
  const data = {
    users: await db.getAll('users'),
    courses: await db.getAll('courses'),
    purchases: await db.getAll('purchases'),
    certificates: await db.getAll('certificates'),
    prices: await db.get('prices', 'default'),
    settings: await db.getSettings(),
    activity_log: await db.getAll('activity_log'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rise-africa-export-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  this.toast('Data exported!', 'success');
};

app.resetDemoData = async function() {
  if (!confirm('Reset to demo data? All current data will be lost.')) return;
  await db.clear('users'); await db.clear('courses'); await db.clear('purchases');
  await db.clear('certificates'); await db.clear('activity_log'); await db.clear('prices'); await db.clear('settings');
  await this.loadDemoData();
  this.toast('Demo data restored!', 'success');
  this.navigate('admin', {tab:'settings'});
};

app.clearAllData = async function() {
  if (!confirm('⚠️ WARNING: This will delete ALL data permanently!')) return;
  if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
  const stores = ['users', 'courses', 'purchases', 'certificates', 'activity_log', 'prices', 'settings', 'syncQueue'];
  for (const s of stores) await db.clear(s);
  sessionStorage.removeItem('currentUser');
  localStorage.removeItem('cart');
  this.currentUser = null; this.cart = [];
  this.toast('All data cleared', 'success');
  this.navigate('home');
};

// ==================== ANALYTICS TRACKING ====================
app.trackEvent = function(eventName, params = {}) {
  if (typeof gtag === 'function') {
    gtag('event', eventName, params);
  }
  // Also log to local activity for admin analytics
  if (this.currentUser) {
    db.logActivity(this.currentUser.email, 'Analytics: ' + eventName, JSON.stringify(params)).catch(() => {});
  }
};

app.trackPageView = function(page) {
  if (typeof gtag === 'function') {
    gtag('event', 'page_view', { page_title: page, page_location: window.location.href });
  }
};

// ==================== SERVICE WORKER (OFFLINE) ====================
if ('serviceWorker' in navigator) {
  const swCode = [
    "self.addEventListener('install', e => {",
    "  e.waitUntil(caches.open('rise-africa-v1').then(cache => cache.addAll(['/'])));",
    "  self.skipWaiting();",
    "});",
    "self.addEventListener('activate', e => {",
    "  e.waitUntil(self.clients.claim());",
    "});",
    "self.addEventListener('fetch', e => {",
    "  e.respondWith(",
    "    caches.match(e.request).then(response => {",
    "      return response || fetch(e.request).catch(() => new Response('Offline', { status: 503 }));",
    "    })",
    "  );",
    "});"
  ].join("\n");
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
