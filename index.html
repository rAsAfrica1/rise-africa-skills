            const grid = document.getElementById('gridCourses');

            list.forEach(c => {
                grid.innerHTML += `
                    <div class="course-card">
                        <div class="course-title">${c.title}</div>
                        <div class="badge">${c.category}</div>
                        <p class="desc">${c.desc}</p>
                        <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;">📅 ${c.duration}</p>

                        </div>
                        <div class="actions">

                            <button class="secondary" onclick="qrshare(${c.id})">📱 QR</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCourses() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const filtered = COURSES.filter(c => 
                (c.title.toLowerCase().includes(search) || c.desc.toLowerCase().includes(search)) &&
                (!cat || c.category === cat)
            );
            displayCourses(filtered);
        }

        function enroll(id) { alert('Enrolling in course #' + id + '\n\nPayment: $8/$10/$3.50\nProcessing...'); }
        function gift(id) { const email = prompt('Gift to email:'); if(email) alert('Gift sent to ' + email); }
        function qrshare(id) { alert('QR Code for course #' + id + '\n\nSharing to 40+ platforms...'); }
