<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="zt">
<title id="zt">Zola, a friendly robot built from a jerry can, bottle caps and wire</title>
<defs>
 <linearGradient id="can" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#E89A0F"/>
 </linearGradient>
 <linearGradient id="tin" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#B9C4D6"/><stop offset="1" stop-color="#7C8AA3"/>
 </linearGradient>
</defs>
<!-- wire antenna -->
<path d="M100 34 C100 18 112 16 116 8" stroke="#00A86B" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="117" cy="6" r="6" fill="#FF5A36"/>
<!-- jerry-can head -->
<rect x="46" y="34" width="108" height="86" rx="16" fill="url(#can)" stroke="#8A5C05" stroke-width="4"/>
<rect x="86" y="26" width="28" height="14" rx="5" fill="#E5397F" stroke="#8A2050" stroke-width="3"/>
<!-- jerry-can ribs -->
<path d="M60 52v50M140 52v50" stroke="#C98A12" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<!-- bottle-cap eyes -->
<circle cx="80" cy="72" r="17" fill="#FFF8EC" stroke="#8A5C05" stroke-width="3"/>
<circle cx="120" cy="72" r="17" fill="#FFF8EC" stroke="#8A5C05" stroke-width="3"/>
<circle cx="83" cy="74" r="8" fill="#14122B"/><circle cx="123" cy="74" r="8" fill="#14122B"/>
<circle cx="86" cy="71" r="3" fill="#fff"/><circle cx="126" cy="71" r="3" fill="#fff"/>
<!-- smile -->
<path d="M78 98 Q100 112 122 98" stroke="#8A5C05" stroke-width="5" fill="none" stroke-linecap="round"/>
<!-- tin-can body -->
<rect x="60" y="124" width="80" height="66" rx="12" fill="url(#tin)" stroke="#5A6577" stroke-width="4"/>
<rect x="72" y="138" width="56" height="26" rx="6" fill="#14122B" opacity=".85"/>
<circle cx="86" cy="151" r="5" fill="#00A86B"/><circle cx="100" cy="151" r="5" fill="#FFB627"/>
<circle cx="114" cy="151" r="5" fill="#1E88E5"/>
<!-- wire arms -->
<path d="M60 140 C40 144 34 158 40 170" stroke="#00A86B" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M140 140 C160 144 166 158 160 170" stroke="#00A86B" stroke-width="7" fill="none" stroke-linecap="round"/>
<circle cx="38" cy="174" r="8" fill="#FFB627" stroke="#8A5C05" stroke-width="3"/>
<circle cx="162" cy="174" r="8" fill="#FFB627" stroke="#8A5C05" stroke-width="3"/>
<!-- bottle-cap feet -->
<ellipse cx="80" cy="200" rx="17" ry="10" fill="#E5397F" stroke="#8A2050" stroke-width="3"/>
<ellipse cx="120" cy="200" rx="17" ry="10" fill="#E5397F" stroke="#8A2050" stroke-width="3"/>
</svg>
