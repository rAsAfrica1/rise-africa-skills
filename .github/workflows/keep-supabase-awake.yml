name: Keep Supabase awake

# Free-plan Supabase projects pause after about 7 days of low database activity.
# A paused project means course-lock.js cannot check enrollments, and every
# student is locked out of every course. This makes one small query each day.
# The key below is the PUBLIC anon key, already published in course-lock.js.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          URL="https://lsvmykrentkbcdrzsaqj.supabase.co/rest/v1/enrollments?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzdm15a3JlbnRrYmNkcnpzYXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDkzMjYsImV4cCI6MjEwMTM4NTMyNn0.6cbb7S-5Me8UNJDpn9aWkPHdK18Y8GEqOfypx16Fkdc"
          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "HTTP $CODE"
          echo "Response: $(head -c 300 /tmp/body.txt)"
          if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then
            echo "::error::Supabase did not respond (HTTP $CODE). The project may be paused."
            exit 1
          fi
          echo "Supabase responded. Project is awake."