        input { flex: 1; padding: 0.8rem; background: var(--card); border: 2px solid var(--gold); color: var(--text); border-radius: 6px; }
        button { padding: 0.8rem 1.5rem; background: var(--gold); color: #111; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
        .agent-info { background: rgba(201, 162, 39, 0.1); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border-left: 4px solid var(--gold); }

<body>
    <div class="sidebar">
        <h3 style="color: var(--gold); margin-bottom: 1rem;">🤖 Select Agent</h3>
        <button class="agent-button" onclick="selectAgent('Content Master')">📝 Content Master</button>
        <button class="agent-button" onclick="selectAgent('Analytics Prophet')">📊 Analytics Prophet</button>
        <button class="agent-button" onclick="selectAgent('Marketing Maestro')">📢 Marketing Maestro</button>
        <button class="agent-button" onclick="selectAgent('Support Sentinel')">💬 Support Sentinel</button>
        <button class="agent-button" onclick="selectAgent('Pricing Optimizer')">💰 Pricing Optimizer</button>
        <button class="agent-button" onclick="selectAgent('Growth Hacker')">🚀 Growth Hacker</button>
        <button class="agent-button" onclick="selectAgent('Quality Assurance')">✅ Quality Assurance</button>
        <button class="agent-button" onclick="selectAgent('Referral Engine')">🔗 Referral Engine</button>
        <button class="agent-button" onclick="selectAgent('Trend Scout')">🔍 Trend Scout</button>
        <button class="agent-button" onclick="selectAgent('Retention Warrior')">👥 Retention Warrior</button>
        <button class="agent-button" onclick="selectAgent('Email Catalyst')">✉️ Email Catalyst</button>
        <button class="agent-button" onclick="selectAgent('Revenue Maximizer')">💵 Revenue Maximizer</button>
    </div>

    <div class="main">
        <header>
            <h1>🌍 Rise AFRICA Skills Support</h1>
            <p style="color: var(--muted);">24/7 AI-Powered Assistance</p>
            <div class="agent-info">
                <strong id="currentAgent">Select an agent to start</strong>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                <div class="message-bubble">👋 Welcome to rAs Support! Select an agent from the left to get started. Our 12 AI agents are ready to help with courses, sales, analytics, and more.</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let selectedAgent = null;

        const AGENT_INFO = {
            'Content Master': '📝 Creates 5+ courses/week • 99.2% accuracy • Latest trends',
            'Analytics Prophet': '📊 Real-time analytics • 10,000 data points/day • Revenue forecasting',
            'Marketing Maestro': '📢 150+ posts/day • 40+ platform coverage • 96.8% accuracy',
            'Support Sentinel': '💬 1,000 conversations/day • 88% first-contact resolution',
            'Pricing Optimizer': '💰 Dynamic pricing • Adjusts 200x/day • Maximizes revenue',
            'Growth Hacker': '🚀 80+ experiments/day • Finds growth loops • 92.7% accuracy',
            'Quality Assurance': '✅ 300 checks/day • Reviews feedback • 98.9% accuracy',
            'Referral Engine': '🔗 Manages 250+ affiliates • Daily payouts • 99.8% fraud detection',
            'Trend Scout': '🔍 24/7 monitoring • Emerging skills • 1,000 scans/day',
            'Retention Warrior': '👥 Prevents dropouts • 400 interventions/day • Peer mentoring',
            'Email Catalyst': '✉️ Sends 5,000/day • 32% open rate • A/B testing',
            'Revenue Maximizer': '💵 Upsell opportunities • Bundle creation • 18% success rate'
        };

        function selectAgent(agent) {
            selectedAgent = agent;
            document.getElementById('currentAgent').textContent = '🤖 ' + agent + ' - ' + AGENT_INFO[agent];
            document.getElementById('chatArea').innerHTML = '<div class="message assistant"><div class="message-bubble">Hi! I\'m ' + agent + '. How can I help you today?</div></div>';
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            if (!input.value.trim() || !selectedAgent) return;

            const message = input.value;
            addMessage('user', message);

            setTimeout(() => {
                const response = generateResponse(selectedAgent, message);
                addMessage('assistant', response);
            }, 500);

            input.value = '';
        }

        function addMessage(type, text) {
            const chat = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.innerHTML = '<div class="message-bubble">' + text + '</div>';
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function generateResponse(agent, query) {
            const responses = {
                'Content Master': 'I can create courses on: Agriculture, Business, Services, Food, Crafts, Manufacturing. What topic interests you?',
                'Analytics Prophet': 'Current metrics: 159 courses • 40+ platforms • 72% completion rate • $8-100k monthly revenue potential',
                'Marketing Maestro': 'I\'ll generate posts for WhatsApp, Facebook, Twitter, LinkedIn, Instagram, TikTok and 34+ more platforms daily!',
                'Support Sentinel': 'I handle customer questions 24/7 with 88% auto-resolution. Escalating complex issues to humans in 2-4 hours.',
                'Pricing Optimizer': 'Dynamic pricing active: Base $8 stable • Bundles 10-20% off • Peak pricing +5% weekends • Holiday premiums',
                'Growth Hacker': 'Running 80 experiments/day. Recent wins: +300% student growth • +150% revenue • 6.2% referral conversion',
                'Quality Assurance': 'All 159 courses verified: ✓ Accurate ✓ Complete ✓ Mobile-ready ✓ Offline compatible',
                'Referral Engine': '250+ active affiliates earning $45/month average • $2,100+/month guaranteed • Daily payouts enabled',
                'Trend Scout': 'Trending now: Digital marketing (up 45%) • Food processing (up 38%) • E-commerce (up 52%)',
                'Retention Warrior': 'Preventing dropouts with personalized encouragement. Currently tracking 400 at-risk students daily.',
                'Email Catalyst': 'Sending 5,000 emails/day with 32% open rate (vs 21% industry). A/B testing all subject lines.',
                'Revenue Maximizer': 'Identified upsell opportunities: Bundles +22% revenue • Business Seed Records +$5 • Premium content +18% uptake'
            };
            return responses[agent] || 'How can I assist you?';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
