<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" style="background:#fafaf7;font-family:system-ui">
<text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700">Breeding Calendar - 12 Months</text>
<g font-size="10" font-family="system-ui">
<text x="20" y="70">Sow 1</text><line x1="90" y1="65" x2="180" y2="65" stroke="#2a7" stroke-width="4"/><line x1="180" y1="65" x2="330" y2="65" stroke="#e94" stroke-width="4"/><line x1="330" y1="65" x2="400" y2="65" stroke="#c9e4ff" stroke-width="4"/>
<text x="20" y="105">Sow 2</text><line x1="150" y1="100" x2="240" y2="100" stroke="#2a7" stroke-width="4"/><line x1="240" y1="100" x2="390" y2="100" stroke="#e94" stroke-width="4"/><line x1="390" y1="100" x2="460" y2="100" stroke="#c9e4ff" stroke-width="4"/>
<text x="20" y="140">Sow 3</text><line x1="210" y1="135" x2="300" y2="135" stroke="#2a7" stroke-width="4"/><line x1="300" y1="135" x2="450" y2="135" stroke="#e94" stroke-width="4"/><line x1="450" y1="135" x2="520" y2="135" stroke="#c9e4ff" stroke-width="4"/>
<text x="20" y="175">Sow 4</text><line x1="270" y1="170" x2="360" y2="170" stroke="#2a7" stroke-width="4"/><line x1="360" y1="170" x2="510" y2="170" stroke="#e94" stroke-width="4"/><line x1="510" y1="170" x2="580" y2="170" stroke="#c9e4ff" stroke-width="4"/>
<text x="20" y="210">Sow 5</text><line x1="330" y1="205" x2="420" y2="205" stroke="#2a7" stroke-width="4"/><line x1="420" y1="205" x2="570" y2="205" stroke="#e94" stroke-width="4"/><line x1="570" y1="205" x2="640" y2="205" stroke="#c9e4ff" stroke-width="4"/>
<text x="20" y="245">Sow 6</text><line x1="390" y1="240" x2="480" y2="240" stroke="#2a7" stroke-width="4"/><line x1="480" y1="240" x2="630" y2="240" stroke="#e94" stroke-width="4"/>
<text x="20" y="280">Sow 7</text><line x1="450" y1="275" x2="540" y2="275" stroke="#2a7" stroke-width="4"/><line x1="540" y1="275" x2="680" y2="275" stroke="#e94" stroke-width="4"/>
</g>
<rect x="90" y="310" width="30" height="10" fill="#2a7"/><text x="125" y="320" font-size="10">Pregnant</text>
<rect x="200" y="310" width="30" height="10" fill="#e94"/><text x="235" y="320" font-size="10">Lactating</text>
<rect x="310" y="310" width="30" height="10" fill="#c9e4ff"/><text x="345" y="320" font-size="10">Growing pigs</text>
</svg>
