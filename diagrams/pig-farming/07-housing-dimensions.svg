<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" style="background:#fafaf7;font-family:system-ui">
<text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700">Pig Housing - Space Per Pig</text>
<rect x="50" y="60" width="120" height="120" fill="#ffe0e0" stroke="#c33" stroke-width="2"/>
<text x="110" y="115" text-anchor="middle" font-size="11" font-weight="700">WEANER</text>
<text x="110" y="135" text-anchor="middle" font-size="10">0.3 m²</text>
<text x="110" y="155" text-anchor="middle" font-size="9">7-25 kg</text>
<rect x="190" y="60" width="150" height="120" fill="#ffe8c9" stroke="#e94" stroke-width="2"/>
<text x="265" y="115" text-anchor="middle" font-size="11" font-weight="700">GROWER</text>
<text x="265" y="135" text-anchor="middle" font-size="10">0.7 m²</text>
<text x="265" y="155" text-anchor="middle" font-size="9">25-50 kg</text>
<rect x="360" y="60" width="150" height="120" fill="#d4f0d4" stroke="#2a7" stroke-width="2"/>
<text x="435" y="115" text-anchor="middle" font-size="11" font-weight="700">FINISHER</text>
<text x="435" y="135" text-anchor="middle" font-size="10">1.0 m²</text>
<text x="435" y="155" text-anchor="middle" font-size="9">50-90 kg</text>
<rect x="530" y="60" width="120" height="120" fill="#c9e4ff" stroke="#2a7" stroke-width="2"/>
<text x="590" y="115" text-anchor="middle" font-size="11" font-weight="700">SOW</text>
<text x="590" y="135" text-anchor="middle" font-size="10">1.5 m²</text>
<text x="590" y="155" text-anchor="middle" font-size="9">Group housing</text>
<text x="350" y="240" text-anchor="middle" font-size="11" fill="#333">Ventilation: min 0.5 m² opening per pig</text>
<text x="350" y="265" text-anchor="middle" font-size="11" fill="#333">Water: 5-10 litres/day per pig</text>
<text x="350" y="290" text-anchor="middle" font-size="11" fill="#333">Trough space: 30cm per pig</text>
<text x="350" y="330" text-anchor="middle" font-size="10" fill="#888">Adjust for climate. Hot regions need 20% more space.</text>
</svg>
