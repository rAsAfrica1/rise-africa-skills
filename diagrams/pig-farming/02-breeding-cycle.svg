<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="background:#fafaf7;font-family:system-ui">
<text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700">The 149-Day Pig Breeding Cycle</text>
<line x1="50" y1="150" x2="650" y2="150" stroke="#333" stroke-width="2"/>
<circle cx="50" cy="150" r="8" fill="#2a7"/>
<circle cx="330" cy="150" r="8" fill="#e94"/>
<circle cx="620" cy="150" r="8" fill="#2a7"/>
<text x="50" y="130" text-anchor="middle" font-size="11" font-weight="700">Bred</text>
<text x="50" y="180" text-anchor="middle" font-size="10">Day 0</text>
<text x="330" y="130" text-anchor="middle" font-size="11" font-weight="700">Farrow</text>
<text x="330" y="180" text-anchor="middle" font-size="10">Day 114</text>
<text x="620" y="130" text-anchor="middle" font-size="11" font-weight="700">Ready</text>
<text x="620" y="180" text-anchor="middle" font-size="10">Day 149</text>
<line x1="50" y1="150" x2="330" y2="150" stroke="#2a7" stroke-width="6"/>
<line x1="330" y1="150" x2="620" y2="150" stroke="#e94" stroke-width="6"/>
<text x="190" y="220" text-anchor="middle" font-size="11" fill="#2a7" font-weight="700">GESTATION</text>
<text x="190" y="235" text-anchor="middle" font-size="10">114 days</text>
<text x="475" y="220" text-anchor="middle" font-size="11" fill="#e94" font-weight="700">LACTATION + WEAN</text>
<text x="475" y="235" text-anchor="middle" font-size="10">35 days</text>
</svg>
