<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="background:#fafaf7;font-family:system-ui">
<text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700">Feed Stages: Birth to Market</text>
<rect x="50" y="80" width="140" height="140" fill="#ffe0e0" stroke="#c33" stroke-width="2"/>
<text x="120" y="120" text-anchor="middle" font-size="12" font-weight="700">STARTER</text>
<text x="120" y="140" text-anchor="middle" font-size="10">0-15 kg</text>
<text x="120" y="160" text-anchor="middle" font-size="10">Days 0-30</text>
<text x="120" y="180" text-anchor="middle" font-size="10">~15 kg feed</text>
<rect x="210" y="80" width="140" height="140" fill="#ffe8c9" stroke="#e94" stroke-width="2"/>
<text x="280" y="120" text-anchor="middle" font-size="12" font-weight="700">GROWER</text>
<text x="280" y="140" text-anchor="middle" font-size="10">15-50 kg</text>
<text x="280" y="160" text-anchor="middle" font-size="10">Days 30-70</text>
<text x="280" y="180" text-anchor="middle" font-size="10">~48 kg feed</text>
<rect x="370" y="80" width="140" height="140" fill="#d4f0d4" stroke="#2a7" stroke-width="2"/>
<text x="440" y="120" text-anchor="middle" font-size="12" font-weight="700">FINISHER</text>
<text x="440" y="140" text-anchor="middle" font-size="10">50-90 kg</text>
<text x="440" y="160" text-anchor="middle" font-size="10">Days 70-110</text>
<text x="440" y="180" text-anchor="middle" font-size="10">~92 kg feed</text>
<rect x="530" y="80" width="120" height="140" fill="#c9e4ff" stroke="#2a7" stroke-width="2"/>
<text x="590" y="120" text-anchor="middle" font-size="12" font-weight="700">MARKET</text>
<text x="590" y="140" text-anchor="middle" font-size="10">90 kg+</text>
<text x="590" y="160" text-anchor="middle" font-size="10">Day 110+</text>
<text x="590" y="180" text-anchor="middle" font-size="10">Sell</text>
</svg>
