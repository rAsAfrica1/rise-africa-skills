<line x1="30" y1="50" x2="30" y2="350" stroke="#888" stroke-width="1"/>
<text x="20" y="200" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 20 200)">1.8 metres</text>
</svg>
