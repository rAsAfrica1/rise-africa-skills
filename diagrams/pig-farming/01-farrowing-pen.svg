<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" style="background:#fafaf7;font-family:system-ui">
<text x="300" y="25" text-anchor="middle" font-size="16" font-weight="700">Farrowing Pen Layout (2.4m x 1.8m)</text>
<rect x="50" y="50" width="500" height="300" fill="none" stroke="#333" stroke-width="3"/>
<rect x="230" y="50" width="140" height="300" fill="#e8f4ff" stroke="#2a7" stroke-width="2"/>
<text x="300" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5">CREEP AREA</text>
<text x="300" y="218" text-anchor="middle" font-size="10" fill="#555">Piglets only</text>
<rect x="380" y="55" width="165" height="290" fill="#fff3e0" stroke="#c97" stroke-width="2"/>
<text x="462" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5500">SOW AREA</text>
<text x="462" y="218" text-anchor="middle" font-size="10" fill="#555">1.8m x 2.4m</text>
