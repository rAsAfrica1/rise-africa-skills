<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" style="background:#fafaf7;font-family:system-ui">
<text x="350" y="25" text-anchor="middle" font-size="16" font-weight="700">Pig Farming Profit Flow</text>
<rect x="50" y="60" width="180" height="60" fill="#d4f0d4" stroke="#2a7" stroke-width="2"/>
<text x="140" y="85" text-anchor="middle" font-size="12" font-weight="700">Revenue</text>
<text x="140" y="105" text-anchor="middle" font-size="10">$180/pig</text>
<rect x="260" y="60" width="180" height="60" fill="#ffe0e0" stroke="#c33" stroke-width="2"/>
<text x="350" y="85" text-anchor="middle" font-size="12" font-weight="700">Direct Costs</text>
<text x="350" y="105" text-anchor="middle" font-size="10">~$131/pig</text>
<rect x="470" y="60" width="180" height="60" fill="#c9e4ff" stroke="#2a7" stroke-width="2"/>
<text x="560" y="85" text-anchor="middle" font-size="12" font-weight="700">Gross Profit</text>
<text x="560" y="105" text-anchor="middle" font-size="10">~$49/pig</text>
<line x1="230" y1="90" x2="260" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="90" x2="470" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333"/></marker></defs>
<text x="350" y="180" text-anchor="middle" font-size="11" fill="#333">Feed = 65-75% of total cost</text>
<text x="350" y="205" text-anchor="middle" font-size="11" fill="#333">Labour = 8-12%</text>
<text x="350" y="230" text-anchor="middle" font-size="11" fill="#333">Vet + meds = 4-6%</text>
<text x="350" y="255" text-anchor="middle" font-size="11" fill="#333">Housing = 3-5%</text>
<text x="350" y="300" text-anchor="middle" font-size="12" fill="#1a5" font-weight="700">Target margin: 25-35%</text>
</svg>
