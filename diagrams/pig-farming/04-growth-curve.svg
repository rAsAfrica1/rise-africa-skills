<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" style="background:#fafaf7;font-family:system-ui">
<text x="300" y="25" text-anchor="middle" font-size="16" font-weight="700">Pig Growth Curve - Target Weights</text>
<line x1="80" y1="300" x2="550" y2="300" stroke="#333" stroke-width="2"/>
<line x1="80" y1="60" x2="80" y2="300" stroke="#333" stroke-width="2"/>
<text x="315" y="330" text-anchor="middle" font-size="11">Age (days)</text>
<text x="40" y="180" text-anchor="middle" font-size="11" transform="rotate(-90 40 180)">Weight (kg)</text>
<text x="80" y="315" text-anchor="middle" font-size="9">0</text>
<text x="190" y="315" text-anchor="middle" font-size="9">30</text>
<text x="300" y="315" text-anchor="middle" font-size="9">60</text>
<text x="410" y="315" text-anchor="middle" font-size="9">90</text>
<text x="520" y="315" text-anchor="middle" font-size="9">110</text>
<polyline points="80,290 190,240 300,150 410,90 520,70" fill="none" stroke="#2a7" stroke-width="4"/>
<circle cx="80" cy="290" r="5" fill="#2a7"/><text x="90" y="285" font-size="10">1.5kg</text>
<circle cx="190" cy="240" r="5" fill="#2a7"/><text x="200" y="235" font-size="10">15kg</text>
<circle cx="300" cy="150" r="5" fill="#2a7"/><text x="310" y="145" font-size="10">50kg</text>
<circle cx="410" cy="90" r="5" fill="#2a7"/><text x="420" y="85" font-size="10">80kg</text>
<circle cx="520" cy="70" r="5" fill="#2a7"/><text x="530" y="65" font-size="10">95kg</text>
</svg>
