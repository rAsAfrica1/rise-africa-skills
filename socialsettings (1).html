    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --gold: #C9A227; --dark: #1a1a1a; --darker: #111; --card: #1e1e1e; --text: #e0e0e0; --muted: #888; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark); color: var(--text); padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--gold); font-size: 2rem; margin-bottom: 0.5rem; }
        .counter { color: var(--muted); font-size: 1.1rem; margin: 1rem 0; }
        .stat-box { background: var(--card); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--gold); margin-bottom: 2rem; text-align: center; }
        .stat-number { color: var(--gold); font-size: 2rem; font-weight: 700; }
        .controls { display: flex; gap: 1rem; margin-bottom: 2rem; justify-content: center; flex-wrap: wrap; }
        button { padding: 0.8rem 1.5rem; background: var(--gold); color: var(--darker); border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; }
        button:hover { background: #e0c050; }
        .platforms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .platform-card { background: var(--card); border: 2px solid rgba(201, 162, 39, 0.3); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.3s; }
        .platform-card:hover { border-color: var(--gold); }
        .platform-card.enabled { border-color: var(--gold); background: rgba(201, 162, 39, 0.1); }
        .platform-name { font-weight: 700; margin: 0.5rem 0; }
        .status-badge { display: inline-block; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
        .status-badge.on { background: #4CAF50; color: white; }
        .status-badge.off { background: #666; color: white; }
    </style>

<body>
    <div class="container">
        <header>
            <h1>📱 Social Platform Settings</h1>
            <p style="color: var(--muted);">Toggle 40+ platforms on/off</p>
        </header>

        <div class="stat-box">
            <div>Platforms Enabled: <span class="stat-number" id="enabledCount">0</span>/<span class="stat-number" id="totalCount">0</span></div>
            <div class="counter" id="coverage">Coverage: 0%</div>
        </div>

        <div class="controls">
            <button onclick="enableAll()">✓ Enable All</button>
            <button onclick="disableAll()">✗ Disable All</button>
        </div>

        <div class="platforms-grid" id="platformsGrid"></div>
    </div>

    <script>
        const SOCIAL_PLATFORMS = [
            {id:'whatsapp',name:'WhatsApp',emoji:'💬'},{id:'facebook',name:'Facebook',emoji:'f'},{id:'twitter',name:'Twitter',emoji:'𝕏'},
            {id:'linkedin',name:'LinkedIn',emoji:'in'},{id:'instagram',name:'Instagram',emoji:'📷'},{id:'tiktok',name:'TikTok',emoji:'🎵'},
            {id:'youtube',name:'YouTube',emoji:'▶️'},{id:'email',name:'Email',emoji:'✉️'},{id:'sms',name:'SMS',emoji:'💬'},
            {id:'discord',name:'Discord',emoji:'🎮'},{id:'slack',name:'Slack',emoji:'#'},{id:'telegram',name:'Telegram',emoji:'✈️'},
            {id:'wechat',name:'WeChat',emoji:'🤝'},{id:'qq',name:'QQ',emoji:'Q'},{id:'line',name:'LINE',emoji:'🟢'},
            {id:'kakao',name:'Kakao',emoji:'Y'},{id:'nextdoor',name:'Nextdoor',emoji:'🏠'},{id:'quora',name:'Quora',emoji:'?'},
            {id:'medium',name:'Medium',emoji:'M'},{id:'substack',name:'Substack',emoji:'📧'},{id:'hashnode',name:'Hashnode',emoji:'#'},
            {id:'devto',name:'Dev.to',emoji:'<>'},{id:'twitch',name:'Twitch',emoji:'🎮'},{id:'vimeo',name:'Vimeo',emoji:'▶️'},
            {id:'pinterest',name:'Pinterest',emoji:'📌'},{id:'reddit',name:'Reddit',emoji:'R'},{id:'tumblr',name:'Tumblr',emoji:'T'},
            {id:'bluesky',name:'Bluesky',emoji:'☁️'},{id:'mastodon',name:'Mastodon',emoji:'🐘'},{id:'signal',name:'Signal',emoji:'🔐'},
            {id:'viber',name:'Viber',emoji:'☎️'},{id:'skype',name:'Skype',emoji:'☁️'},{id:'zoom',name:'Zoom',emoji:'📹'},
            {id:'snapchat',name:'Snapchat',emoji:'👻'},{id:'shopify',name:'Shopify',emoji:'🛍️'},{id:'etsy',name:'Etsy',emoji:'🎨'},
            {id:'tiktokshop',name:'TikTok Shop',emoji:'🛒'},{id:'opensea',name:'OpenSea',emoji:'🌊'},{id:'whatsappchannel',name:'WhatsApp Channel',emoji:'📢'}
        ];

        function getEnabledPlatforms() {
            return JSON.parse(localStorage.getItem('enabledPlatforms') || '[]');
        }

        function setPlatformState(id, enabled) {
            let enabled_list = getEnabledPlatforms();
            if (enabled && !enabled_list.includes(id)) {
                enabled_list.push(id);
            } else if (!enabled) {
                enabled_list = enabled_list.filter(p => p !== id);
            }
            localStorage.setItem('enabledPlatforms', JSON.stringify(enabled_list));
            updateDisplay();
        }

        function updateDisplay() {
            const enabled = getEnabledPlatforms();
            const total = SOCIAL_PLATFORMS.length;
            document.getElementById('enabledCount').textContent = enabled.length;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('coverage').textContent = `Coverage: ${Math.round(enabled.length/total*100)}%`;
            
            SOCIAL_PLATFORMS.forEach(p => {
                const card = document.getElementById('platform-' + p.id);
                if (card) {
                    if (enabled.includes(p.id)) {
                        card.classList.add('enabled');
                        card.querySelector('.status').innerHTML = '<span class="status-badge on">ON</span>';
                    } else {
                        card.classList.remove('enabled');
                        card.querySelector('.status').innerHTML = '<span class="status-badge off">OFF</span>';
                    }
                }
            });
        }

        function enableAll() {
            const all = SOCIAL_PLATFORMS.map(p => p.id);
            localStorage.setItem('enabledPlatforms', JSON.stringify(all));
            updateDisplay();
        }

        function disableAll() {
            localStorage.setItem('enabledPlatforms', JSON.stringify([]));
            updateDisplay();
        }

        function togglePlatform(id) {
            const enabled = getEnabledPlatforms();
            if (enabled.includes(id)) {
                setPlatformState(id, false);
            } else {
                setPlatformState(id, true);
            }
        }

        // Initialize
        const grid = document.getElementById('platformsGrid');
        SOCIAL_PLATFORMS.forEach(p => {
            const card = document.createElement('div');
            card.id = 'platform-' + p.id;
            card.className = 'platform-card';
            card.onclick = () => togglePlatform(p.id);
            card.innerHTML = `<div style="font-size: 2rem; margin-bottom: 0.5rem;">${p.emoji}</div><div class="platform-name">${p.name}</div><div class="status"></div>`;
            grid.appendChild(card);
        });

        updateDisplay();
    </script>
</body>
