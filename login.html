<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In - rise AFRICA skills</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c9a227;--darker:#0f0f1a;--card:#1e1e32;--muted:#9a9ab0;--green:#27ae60;--red:#e74c3c;--border:rgba(201,162,39,.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--darker);color:#e8e8e8;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
header{background:rgba(15,15,26,0.95);border-bottom:1px solid var(--border);padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem}
.logo-icon{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--darker);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
header .brand{font-weight:700;font-size:.95rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:420px;width:100%}
h1{color:var(--gold);font-size:1.5rem;margin-bottom:.5rem;text-align:center}
.sub{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:1.5rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:.9rem 0 .3rem}
input,select{width:100%;padding:.7rem .9rem;background:var(--darker);border:1px solid var(--border);border-radius:8px;color:#e8e8e8;font-size:.95rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:1.2rem;padding:.75rem;background:var(--gold);color:var(--darker);border:none;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:1rem;padding:.7rem .9rem;border-radius:8px;font-size:.9rem;display:none}
.msg.err{background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.3);display:block}
.msg.ok{background:rgba(39,174,96,.12);color:var(--green);border:1px solid rgba(39,174,96,.3);display:block}
.alt{text-align:center;margin-top:1.2rem;font-size:.9rem;color:var(--muted)}
footer{border-top:1px solid rgba(255,255,255,.08);padding:1rem;text-align:center;color:var(--muted);font-size:.8rem}
.remember-row{display:flex;align-items:center;gap:.5rem;margin-top:.9rem}
.remember-row label{margin:0;flex-shrink:0}
.remember-row select{flex:1}
</style>
</head>
<body>
<header>
  <div class="logo-icon">rAs</div>
  <div class="brand">rise AFRICA skills</div>
</header>
<main>
  <div class="card">
    <h1>Sign In</h1>
    <p class="sub">Access your enrolled courses</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">

      <div class="remember-row">
        <label for="remember">Keep me signed in for:</label>
        <select id="remember">
          <option value="900">15 minutes</option>
          <option value="3600">1 hour</option>
          <option value="86400" selected>24 hours</option>
          <option value="604800">7 days</option>
          <option value="2592000">30 days</option>
          <option value="0">Until I sign out</option>
        </select>
      </div>

      <button type="submit" id="btn">Sign In</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="alt">
      <a href="reset-password.html">Forgot password?</a><br><br>
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
</main>
<footer><a href="index.html">Home</a> · <a href="support-us.html">Support</a> · © rise AFRICA skills</footer>

<script>
const SUPABASE_URL = "https://lsvmykrentkbcdrzsaqj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzdm15a3JlbnRrYmNkcnpzYXFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDkzMjYsImV4cCI6MjEwMTM4NTMyNn0.6cbb7S-5Me8UNJDpn9aWkPHdK18Y8GEqOfypx16Fkdc";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// If already logged in, offer to continue
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  const expiry = localStorage.getItem('ras_session_expiry');
  const expired = expiry && Date.now() > parseInt(expiry);
  if (session && !expired) {
    window.location.href = 'index.html';
  }
})();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const remember = parseInt(document.getElementById('remember').value);
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  btn.disabled = false; btn.textContent = 'Sign In';

  if (error) {
    msg.className = 'msg err'; msg.textContent = error.message; return;
  }

  // Store custom expiry
  if (remember > 0) {
    localStorage.setItem('ras_session_expiry', String(Date.now() + remember * 1000));
  } else {
    localStorage.removeItem('ras_session_expiry');
  }

  msg.className = 'msg ok'; msg.textContent = 'Signed in. Redirecting...';
  setTimeout(() => { window.location.href = 'index.html'; }, 600);
});
</script>
<script src="password-toggle.js"></script>
</body>
</html>
